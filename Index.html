<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHE ONE — Database SHE PPA Maruwai Coal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SHE DASHBOARD — PT Putra Perkasa Abadi | Jobsite Maruwai Coal
   Satu berkas mandiri: HTML + CSS + JS.
   Struktur: [1] TOKEN & LAYOUT  [2] KOMPONEN  [3] DATA CONTOH (objek DATA)
             [4] PENYIMPANAN  [5] MODUL  [6] CRUD & IMPOR
   ===================================================================== */

/* ---------- [1] TOKEN WARNA & TIPOGRAFI ---------- */
:root{
  --bg:#F5FAF4;            /* latar utama: gading kehijauan */
  --bg-2:#E8F1E6;
  --card:#FFFFFF;
  --navy:#14532D;          /* hijau tua: teks, header, sidebar */
  --navy-700:#0F3D22;
  --navy-500:#1B7F4B;
  --ink:#16321F;
  --muted:#5C7365;
  --line:#DDE8DA;
  --line-2:#EAF2E8;
  --amber:#FACC15;         /* kuning safety */
  --copper:#EA7317;        /* oranye tembaga */
  --amber-bg:#FEF6DC;
  --green:#16A34A;
  --green-bg:#E4F7E9;
  --red:#DC2626;
  --red-bg:#FDECEC;
  --slate-bg:#EDF4EB;
  --shadow:0 1px 2px rgba(20,83,45,.05), 0 6px 20px rgba(20,83,45,.07);
  --shadow-lg:0 10px 40px rgba(20,83,45,.15);
  --r:14px; --r-sm:10px;
  --sidebar:264px;
}
:root:not([data-theme="light"]){ color-scheme:light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#F7F8FA; --card:#FFFFFF; }
}
:root[data-theme="dark"]{ --bg:#F7F8FA; --card:#FFFFFF; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
h1,h2,h3,h4{margin:0; color:var(--navy); letter-spacing:-.02em; line-height:1.2}
h1{font-size:clamp(26px,4.4vw,40px); font-weight:800}
h2{font-size:20px; font-weight:700}
h3{font-size:16px; font-weight:700}
a{color:var(--copper)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

/* pola kontur topografi tipis sebagai latar halaman */
.topo{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55}

/* ---------- [1b] KERANGKA LAYOUT ---------- */
.shell{display:flex; min-height:100vh; position:relative; z-index:1}

.sidebar{
  width:var(--sidebar); flex:0 0 var(--sidebar); background:var(--navy);
  color:#DCEFE0; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  transition:width .22s ease, flex-basis .22s ease;
}
.sidebar .brand{display:flex; gap:11px; align-items:center; padding:20px 18px 16px}
.brand-mark{width:38px; height:38px; flex:0 0 38px; border-radius:9px; background:#fff; padding:3px; object-fit:contain}
.brand-full{height:22px; display:block; margin-bottom:3px}
.brand-txt strong{display:block; color:#fff; font-size:15px; font-weight:800; letter-spacing:-.01em}
.brand-txt span{display:block; font-size:11.5px; color:#9CC2A8}
.navlist{list-style:none; margin:6px 0 0; padding:0 10px; overflow:auto; flex:1}
.navlist button{
  width:100%; display:flex; align-items:center; gap:12px; background:none; border:0;
  color:#CBE4D2; padding:11px 12px; border-radius:10px; cursor:pointer; text-align:left;
  font-size:14.5px; font-weight:500; transition:background .15s, color .15s;
}
.navlist button:hover{background:rgba(255,255,255,.08); color:#fff}
.navlist button.on{background:linear-gradient(90deg,#FACC15,#EA7317); color:#2A1400; font-weight:700}
.navlist svg{flex:0 0 20px; width:20px; height:20px}
.nav-label{white-space:nowrap}
.sidebar .foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.12); font-size:11.5px; color:#93BBA1}
.sidebar .foot b{color:#E8F5EC; display:block; font-weight:600}
.collapse{margin:0 10px 10px; background:rgba(255,255,255,.07); border:0; color:#BCDCC6; border-radius:10px; padding:9px; cursor:pointer; display:flex; gap:10px; align-items:center; font-size:13px}
.collapse:hover{background:rgba(255,255,255,.14)}
body.rail{--sidebar:76px}
body.rail .nav-label,body.rail .brand-txt,body.rail .foot,body.rail .collapse span{display:none}
body.rail .navlist button{justify-content:center; padding:12px 0}
body.rail .collapse{justify-content:center}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:40; background:rgba(245,250,244,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:11px 22px;
}
.topbar .now{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap}
.hamb{display:none; width:40px; height:40px; border:1px solid var(--line); background:var(--card); border-radius:10px; align-items:center; justify-content:center; cursor:pointer}
.page-title{font-size:16px; font-weight:700; color:var(--navy)}
.wrap{padding:22px; max-width:1480px; width:100%; margin:0 auto}
.page{display:none; animation:rise .28s ease both}
.page.on{display:block}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ---------- [2] KOMPONEN ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; gap:10px; padding:16px 18px 0}
.card-h h3{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid; gap:16px}
.sub{color:var(--muted); font-size:13px}
.mt{margin-top:16px}

/* HERO */
.hero{position:relative; overflow:hidden; border-radius:18px; background:linear-gradient(135deg,#FFFFFF 0%,#EFF9EA 38%,#FEF7DA 70%,#FDE8CC 100%); border:1px solid var(--line); box-shadow:var(--shadow)}
.hero-in{position:relative; z-index:2; padding:26px 26px 92px; max-width:720px}
.hero h1{max-width:16ch}
.hero p{color:#4A5E76; margin:10px 0 0; max-width:54ch}
.hero-pit{position:absolute; left:0; right:0; bottom:-1px; width:100%; height:150px; z-index:1}
.eyebrow{display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); color:var(--copper); font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px}
.counter{display:flex; flex-wrap:wrap; gap:26px; margin-top:18px}
.counter div span{display:block; font-size:11.5px; color:var(--muted); font-weight:600}
.counter div b{font-size:clamp(22px,3.2vw,30px); color:var(--navy); font-weight:800; letter-spacing:-.03em}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .16s ease, box-shadow .16s ease}
.kpi:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg)}
.kpi::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--amber)}
.kpi.g::after{background:var(--green)} .kpi.r::after{background:var(--red)} .kpi.n::after{background:var(--navy)}
.kpi .lb{font-size:12px; color:var(--muted); font-weight:600; display:flex; gap:7px; align-items:center}
.kpi .vl{font-size:28px; font-weight:800; color:var(--navy); letter-spacing:-.03em; margin-top:6px; line-height:1.1}
.kpi .vl small{font-size:13px; font-weight:600; color:var(--muted); letter-spacing:0}
.kpi .dt{font-size:12px; color:var(--muted); margin-top:3px}
.spark{height:34px; margin-top:8px}

/* Tabel */
.tw{overflow:auto; border-radius:var(--r-sm); border:1px solid var(--line-2)}
table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:640px}
thead th{background:var(--slate-bg); color:var(--navy); font-weight:700; font-size:12px; text-align:left; padding:11px 12px; white-space:nowrap; position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line)}
tbody td{padding:11px 12px; border-bottom:1px solid var(--line-2); vertical-align:top}
tbody tr:hover{background:#FAFBFD}
tbody tr.over{background:#FEF2F2}
tbody tr.over:hover{background:#FDE8E8}
tbody tr.soon{background:#FFFBEB}
tbody tr.soon:hover{background:#FEF5DC}
td.num,th.num{text-align:right}
.rowlink{cursor:pointer}

/* Badge & pil */
.bg{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; border:1px solid transparent}
.bg-g{background:var(--green-bg); color:#15803D; border-color:#BBF0CC}
.bg-r{background:var(--red-bg); color:#B91C1C; border-color:#F8C9C9}
.bg-a{background:var(--amber-bg); color:#9A5B06; border-color:#F7DCAE}
.bg-n{background:#E8EEF6; color:var(--navy); border-color:#D3DFEE}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block}

/* Tombol */
.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--card); color:var(--navy); padding:8px 14px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s; white-space:nowrap}
.btn:hover{border-color:#C8D4E4; background:#FBFCFE; transform:translateY(-1px)}
.btn svg{width:16px; height:16px}
.btn-pri{background:linear-gradient(135deg,#F7B733,var(--copper)); border-color:transparent; color:#2A1804; font-weight:700; box-shadow:0 2px 10px rgba(217,119,6,.28)}
.btn-pri:hover{background:linear-gradient(135deg,#F7B23F,#E0850B); color:#2A1804}
.btn-wa{background:#25D366; border-color:transparent; color:#04331A; font-weight:700}
.btn-wa:hover{background:#1FBE5B; color:#04331A}
.btn-nv{background:var(--navy); border-color:transparent; color:#fff}
.btn-nv:hover{background:var(--navy-500); color:#fff}
.btn-dg{color:var(--red); border-color:#F3C8C8; background:#fff}
.btn-dg:hover{background:var(--red-bg)}
.btn-sm{padding:5px 10px; font-size:12.5px; border-radius:8px}
.btn-ico{padding:6px; width:30px; height:30px; justify-content:center}
.bar{display:flex; flex-wrap:wrap; gap:9px; align-items:center}

/* Filter */
.filters{display:flex; flex-wrap:wrap; gap:9px; align-items:center}
.fl{display:flex; flex-direction:column; gap:3px}
.fl label{font-size:11px; color:var(--muted); font-weight:700}
select,input[type=text],input[type=date],input[type=number],input[type=month],textarea{
  border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px 11px; font-size:13.5px; min-width:0}
select:hover,input:hover{border-color:#C8D4E4}
.search{position:relative; flex:1; min-width:180px}
.search input{width:100%; padding-left:34px}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted)}

/* Tab */
.tabs{display:flex; gap:4px; overflow:auto; border-bottom:1px solid var(--line); margin-bottom:16px}
.tabs button{background:none; border:0; border-bottom:3px solid transparent; padding:10px 14px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap}
.tabs button.on{color:var(--navy); border-color:var(--amber)}
.tabs button:hover{color:var(--navy)}
.tabpane{display:none} .tabpane.on{display:block}

/* Progress & heatmap */
.pb{height:8px; background:var(--bg-2); border-radius:99px; overflow:hidden; min-width:80px}
.pb i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#FACC15,#EA7317); transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pb.ok i{background:linear-gradient(90deg,#34D27B,var(--green))}
.heat td,.heat th{text-align:center; font-size:12px}
.heat td:first-child,.heat th:first-child{text-align:left}
.cellstat{display:inline-block; width:100%; padding:6px 4px; border-radius:7px; font-weight:700; font-size:11.5px}
.c-ok{background:var(--green-bg); color:#15803D}
.c-no{background:var(--slate-bg); color:#64748B}
.c-ex{background:var(--red-bg); color:#B91C1C}

/* Kartu dokumen & media */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
.doc{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px; transition:.16s}
.doc:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:#D9E2EE}
.doc .no{font-size:11.5px; color:var(--copper); font-weight:700; letter-spacing:.01em}
.doc h4{font-size:14.5px; color:var(--navy); font-weight:700; line-height:1.35; margin:0}
.doc .meta{font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 12px}
.qr{width:52px; height:52px; border:1px dashed #C9D4E2; border-radius:8px; display:grid; place-items:center; color:#94A3B8; flex:0 0 52px; background:#FCFDFE}
.thumb{height:118px; border-radius:10px; overflow:hidden; background:linear-gradient(135deg,#FFF3DE,#FDE4BD); display:grid; place-items:center}
.thumb svg{width:100%; height:100%}
.list-mode .cards{grid-template-columns:1fr}
.list-mode .doc{flex-direction:row; align-items:center; gap:14px}
.list-mode .doc .grow{flex:1}

/* Kontak */
.contact{display:flex; gap:12px; align-items:center; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card)}
.ava{width:40px; height:40px; border-radius:11px; background:var(--amber-bg); color:var(--copper); display:grid; place-items:center; font-weight:800; flex:0 0 40px; font-size:14px}
.emergency{background:linear-gradient(135deg,#FFF6E9,#FFEAD2); border:1px solid #F6D9AE}
.emergency .contact{background:rgba(255,255,255,.86)}

/* Modal */
.ov{position:fixed; inset:0; background:rgba(15,28,45,.5); backdrop-filter:blur(3px); z-index:90; display:none; align-items:flex-start; justify-content:center; padding:18px; overflow:auto}
.ov.on{display:flex}
.modal{background:var(--card); border-radius:16px; width:100%; max-width:760px; box-shadow:var(--shadow-lg); margin:auto; animation:pop .2s ease both}
@keyframes pop{from{opacity:0; transform:translateY(14px) scale(.985)} to{opacity:1; transform:none}}
.modal header{display:flex; align-items:center; gap:12px; padding:17px 20px; border-bottom:1px solid var(--line)}
.modal header h3{flex:1}
.modal .body{padding:20px; max-height:72vh; overflow:auto}
.modal footer{display:flex; gap:9px; justify-content:flex-end; padding:15px 20px; border-top:1px solid var(--line); flex-wrap:wrap}
.form{display:grid; grid-template-columns:1fr 1fr; gap:13px}
.form .f{display:flex; flex-direction:column; gap:5px}
.form .f.full{grid-column:1/-1}
.form label{font-size:12px; font-weight:700; color:var(--navy)}
.form input,.form select,.form textarea{width:100%}
.hint{font-size:11.5px; color:var(--muted)}
.close{border:0; background:var(--bg-2); width:32px; height:32px; border-radius:9px; cursor:pointer; display:grid; place-items:center}
.close:hover{background:#E2E8F0}

/* Toast & status simpan */
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:120; opacity:0; pointer-events:none; transition:.25s; max-width:92vw; text-align:center}
.toast.on{opacity:1; transform:translateX(-50%)}
.savechip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--green-bg); color:#15803D; border:1px solid #BBF0CC}
.savechip.local{background:var(--amber-bg); color:#9A5B06; border-color:#F7DCAE}

/* Panel perhatian */
.alert-row{display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--line)}
.alert-row:last-child{border:0}
.alert-row .age{font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:7px; background:var(--red-bg); color:#B91C1C; white-space:nowrap}
.alert-row .age.w{background:var(--amber-bg); color:#9A5B06}
.empty{padding:34px 16px; text-align:center; color:var(--muted); font-size:13.5px}
.empty svg{width:54px; height:54px; opacity:.5; margin-bottom:8px}

/* Bawah: navigasi mobile */
.botnav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:60; background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.botnav button{flex:1; background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-size:10.5px; font-weight:600; color:var(--muted); cursor:pointer}
.botnav button.on{color:var(--copper)}
.botnav svg{width:21px; height:21px}
.scrim{position:fixed; inset:0; background:rgba(15,28,45,.45); z-index:49; display:none}
.scrim.on{display:block}


/* ---------- [2b] KOMPONEN TAMBAHAN MODUL MONITORING ---------- */
.chip{border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:999px;
  padding:5px 11px; font-size:11.5px; font-weight:700; cursor:pointer; transition:.14s}
.chip:hover{border-color:#C8D4E4; color:var(--navy)}
.chip.on{background:linear-gradient(135deg,#F7B733,var(--copper)); border-color:transparent; color:#2A1804}
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--copper)}
th .sort{margin-left:4px; color:var(--copper); font-size:10px}
.mini{padding:4px 7px; font-size:12px; border-radius:7px; border:1px solid var(--line); background:var(--card); max-width:220px}
select.mini.st-open{background:var(--amber-bg); color:#9A5B06; font-weight:700; border-color:#F7DCAE}
select.mini.st-close{background:var(--green-bg); color:#15803D; font-weight:700; border-color:#BBF0CC}
.massal{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--amber-bg); border:1px solid #F7DCAE;
  border-radius:12px; padding:10px 13px; margin-bottom:12px}
.massal b{color:#8A5206}
.catatan{display:flex; gap:10px; align-items:flex-start; background:#EEF3F9; border:1px solid #D8E3F0;
  border-radius:12px; padding:11px 14px; font-size:13px; color:var(--navy); margin-bottom:10px}
.catatan svg{flex:0 0 15px; color:var(--navy)}
.catatan.peringatan{background:var(--amber-bg); border-color:#F7DCAE; color:#8A5206}
.catatan.peringatan svg{color:#B4741A}
.tautan{background:none; border:0; padding:0; color:var(--copper); font-weight:700; cursor:pointer; text-align:left; font-size:13.5px}
.tautan:hover{text-decoration:underline}
.pic-grup{border:1px solid var(--line-2); border-radius:12px; margin-bottom:8px; overflow:hidden}
.pic-grup summary{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:11px 14px; cursor:pointer;
  background:var(--slate-bg); font-size:13.5px}
.pic-grup summary::-webkit-details-marker{display:none}
.pic-grup summary b{color:var(--navy)}
.pic-grup > .alert-row{padding:10px 14px}
details summary{cursor:pointer}

/* panel detail (drawer) */
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(480px,92vw); background:var(--card); z-index:95;
  box-shadow:var(--shadow-lg); transform:translateX(102%); transition:transform .24s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line)}
.drawer header h3{flex:1}
.drawer .isi{padding:18px; overflow:auto; flex:1}
.drow{display:flex; gap:12px; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line-2); font-size:13.5px}
.drow span{color:var(--muted); flex:0 0 42%}
.drow b{text-align:right; color:var(--navy); word-break:break-word}
.drawer-scrim{position:fixed; inset:0; background:rgba(15,28,45,.42); z-index:94; display:none}
.drawer-scrim.on{display:block}
@media print{ .drawer,.drawer-scrim,.massal,.chip{display:none!important} }

/* ---------- RESPONSIF ---------- */
@media (max-width:1100px){ .hide-md{display:none} }
@media (max-width:900px){
  .sidebar{position:fixed; z-index:50; left:0; top:0; transform:translateX(-100%); transition:transform .24s ease; width:262px; flex-basis:262px}
  .sidebar.open{transform:none}
  .hamb{display:flex}
  .wrap{padding:15px 14px 86px}

const $  = (s,r=document)=>r.querySelector(s);

const HARI  = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BULAN_P = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

const d = s => { if(!s) return null; const x=new Date(s+"T00:00:00"); return isNaN(x)?null:x; };
const fmt = s => { const x=d(s); return x ? `${x.getDate()} ${BULAN[x.getMonth()]} ${x.getFullYear()}` : "—"; };
const fmtL = s => { const x=d(s); return x ? `${HARI[x.getDay()]}, ${x.getDate()} ${BULAN_P[x.getMonth()]} ${x.getFullYear()}` : "—"; };
const iso = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const selisihHari = (a,b) => Math.round((b-a)/86400000);
const angka = n => (n??0).toLocaleString("id-ID");
const uid = p => p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);
const slug = s => String(s||"").replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").slice(0,60) || uid("x");

function toast(msg, ms=2600){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms); }
function openOv(id){ $("#"+id).classList.add("on"); document.body.style.overflow="hidden"; }
function closeOv(id){ $("#"+id).classList.remove("on"); document.body.style.overflow=""; }

/* nomor HP → format internasional 62… untuk tautan wa.me */
function waNum(hp){
  let n = String(hp||"").replace(/[^0-9]/g,"");
  if(!n) return "";
  if(n.startsWith("0")) n = "62"+n.slice(1);
  if(n.startsWith("8"))  n = "62"+n;
  return n;
}

/* ---------- GRAFIK (digambar sendiri dengan SVG) ---------- */
const C_AMBER="#F5A623", C_COPPER="#D97706", C_NAVY="#1E3A5F", C_GREEN="#16A34A", C_RED="#DC2626", C_SLATE="#94A3B8";

function chLine(labels, series, o={}){
  const W=760,H=o.h||260, pl=42,pr=14,pt=18,pb=34;
  const max = Math.max(4,...series.flatMap(s=>s.v))*1.18;
  const x = i => pl + i*((W-pl-pr)/Math.max(1,labels.length-1));
  const y = v => H-pb-(v/max)*(H-pt-pb);
  const grid = [0,.25,.5,.75,1].map(t=>{
    const yy=H-pb-t*(H-pt-pb), val=Math.round(max*t);
    return `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E7ECF3"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#7C8CA0">${val}</text>`;
  }).join("");
  const paths = series.map((s,si)=>{
    const pts = s.v.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    const area = `M${pl},${H-pb} L${s.v.map((v,i)=>`${x(i)},${y(v)}`).join(" L")} L${x(s.v.length-1)},${H-pb} Z`;
    return `<path d="${area}" fill="${s.c}" opacity=".07"/>
      <polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1600;stroke-dashoffset:1600;animation:dash 1.1s ease forwards ${si*.12}s"/>
      ${s.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="#fff" stroke="${s.c}" stroke-width="2.2"><title>${labels[i]} · ${s.n}: ${v}</title></circle>`).join("")}`;
  }).join("");
  const xl = labels.map((l,i)=> `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="10.5" fill="#7C8CA0">${l}</text>`).join("");
  return `<style>@keyframes dash{to{stroke-dashoffset:0}}</style>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">${grid}${paths}${xl}</svg>
  <div class="bar" style="margin-top:8px">${series.map(s=>`<span class="sub" style="display:inline-flex;gap:6px;align-items:center"><i class="dot" style="background:${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`;
}

function chDonut(parts, o={}){
  const R=64, r=42, cx=80, cy=80, tot=parts.reduce((a,b)=>a+b.v,0)||1;
  let a0=-Math.PI/2, segs="";
  parts.forEach(p=>{
    const a1=a0+(p.v/tot)*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
    const P=(ra,an)=>[cx+ra*Math.cos(an),cy+ra*Math.sin(an)];
    const [x1,y1]=P(R,a0),[x2,y2]=P(R,a1),[x3,y3]=P(r,a1),[x4,y4]=P(r,a0);
    if(p.v>0) segs += `<path d="M${x1} ${y1} A${R} ${R} 0 ${big} 1 ${x2} ${y2} L${x3} ${y3} A${r} ${r} 0 ${big} 0 ${x4} ${y4} Z" fill="${p.c}" opacity=".92"><title>${p.n}: ${p.v}</title></path>`;
    a0=a1;
  });
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 160 160" style="width:150px;height:150px;flex:0 0 150px">${segs}
      <text x="80" y="76" text-anchor="middle" font-size="27" font-weight="800" fill="${C_NAVY}">${tot}</text>
      <text x="80" y="94" text-anchor="middle" font-size="10.5" fill="#7C8CA0">${o.label||"total"}</text></svg>
    <div style="flex:1;min-width:130px">${parts.map(p=>`<div style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px">
      <i class="dot" style="background:${p.c}"></i><span style="flex:1">${esc(p.n)}</span><b style="color:${C_NAVY}">${p.v}</b>
      <span class="sub">${Math.round(p.v/tot*100)}%</span></div>`).join("")}</div></div>`;
}

function chBarV(items, o={}){
  const W=560,H=o.h||230, pl=36,pr=10,pt=16,pb=42;
  const max=Math.max(1,...items.map(i=>i.v))*1.18;
  const bw=(W-pl-pr)/items.length;
  const bars=items.map((it,i)=>{
    const h=(it.v/max)*(H-pt-pb), x=pl+i*bw+bw*.2, y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${bw*.6}" height="${h}" rx="5" fill="${it.c||C_AMBER}" opacity=".9" style="transform-origin:${x}px ${H-pb}px;animation:grow .7s cubic-bezier(.2,.8,.2,1) ${i*.05}s both"><title>${it.n}: ${it.v}</title></rect>
      <text x="${x+bw*.3}" y="${y-6}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${C_NAVY}">${it.v}</text>
      <text x="${x+bw*.3}" y="${H-24}" text-anchor="middle" font-size="10.5" fill="#7C8CA0">${esc(it.n).slice(0,12)}</text>`;
  }).join("");
  return `<style>@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}</style>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#E2E8F0"/>${bars}</svg>`;
}

function chBarH(items, o={}){
  const max=Math.max(1,...items.map(i=>i.v));
  return `<div style="display:grid;gap:9px">${items.map((it,i)=>`
    <div style="display:grid;grid-template-columns:minmax(90px,34%) 1fr auto;gap:10px;align-items:center;font-size:13px">
      <span style="color:${C_NAVY};font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(it.n)}">${esc(it.n)}</span>
      <span class="pb" style="height:10px"><i style="width:${(it.v/max*100).toFixed(1)}%;background:${it.c||`linear-gradient(90deg,${C_AMBER},${C_COPPER})`};animation-delay:${i*.06}s"></i></span>
      <b style="color:${C_NAVY};min-width:24px;text-align:right">${it.v}</b></div>`).join("")}</div>`;
}

function spark(values,color){
  const W=160,H=34,max=Math.max(1,...values);
  const pts=values.map((v,i)=>`${i*(W/(values.length-1||1))},${H-2-(v/max)*(H-6)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none" style="width:100%"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>`;
}

/* =====================================================================
   [4C] LAPISAN DATA MONITORING  (KTA / TTA / INSPEKSI / OBSERVASI)
        Semua angka di modul monitoring dihitung ulang dari baris mentah
        memakai fungsi pembantu di bawah ini. Tidak ada satu pun angka
        agregat yang disimpan sebagai konstanta.
   ===================================================================== */

/* ---------- fungsi pembantu inti ---------- */

/** normalize(v) — rapikan teks: buang spasi di awal/akhir, rapatkan spasi ganda.
 *  Dipakai agar "MC - MESS 72 " dan "MC - MESS 72" tidak terhitung dua kali. */
function normalize(v){ return String(v==null?"":v).replace(/\s+/g," ").trim(); }
/** kunci(v) — bentuk pembanding: hasil normalize dalam HURUF BESAR.
 *  Membuat "Open ", "open", dan "OPEN" dianggap sama. */
function kunci(v){ return normalize(v).toUpperCase(); }

/** weeknum(tgl, 2) — replika Excel WEEKNUM(tanggal; 2): minggu dimulai Senin,
 *  minggu ke-1 adalah minggu yang memuat 1 Januari (bukan ISO-8601 murni). */
function weeknum(tgl, tipe=2){
  const x = tgl instanceof Date ? tgl : d(String(tgl).slice(0,10));
  if(!x) return 0;
  const jan1 = new Date(x.getFullYear(),0,1);
  const geserSenin = (jan1.getDay()+6)%7;                 // Senin=0 … Minggu=6
  const hariKe = Math.round((x - jan1)/86400000);
  return tipe===2 ? Math.floor((hariKe+geserSenin)/7)+1 : Math.floor((hariKe+jan1.getDay())/7)+1;
}
/** bulanDari(tgl) — replika Excel MONTH(tanggal), hasil 1..12 */
function bulanDari(tgl){ const x=d(String(tgl).slice(0,10)); return x? x.getMonth()+1 : 0; }
/** iupDari(lokasi) — replika Excel LEFT(LOKASI;2) untuk sheet INSPEKSI */
function iupDari(lokasi){ return normalize(lokasi).slice(0,2).toUpperCase(); }
/** ageInDays(tgl) — umur temuan dalam hari, dari TGL. PELAPOR sampai hari ini */
function ageInDays(tgl){ const x=d(String(tgl).slice(0,10)); return x? Math.max(0, selisihHari(x,TODAY)) : 0; }

/** countIfs(baris, kriteria) — replika COUNTIFS.
 *  kriteria = {field:nilai} ; nilai boleh string, array (berarti "salah satu"),
 *  angka, atau fungsi penguji. Semua perbandingan teks memakai kunci(). */
function countIfs(baris, kriteria){ return saring(baris, kriteria).length; }
function saring(baris, kriteria){
  const uji = Object.entries(kriteria||{}).filter(([,v])=> v!==undefined && v!=="" && !(Array.isArray(v)&&!v.length));
  if(!uji.length) return baris;
  return baris.filter(r => uji.every(([f,v])=>{
    const nilai = r[f];
    if(typeof v === "function") return v(nilai, r);
    if(Array.isArray(v)) return v.some(y => kunci(y)===kunci(nilai));
    if(typeof v === "number") return Number(nilai)===v;
    return kunci(v)===kunci(nilai);
  }));
}
/** closingRate(baris, kriteria) — Close / (Close + Open) seperti di Excel */
function closingRate(baris, kriteria={}){
  const close = countIfs(baris, {...kriteria, status:"Close"});
  const open  = countIfs(baris, {...kriteria, status:"Open"});
  const total = close+open;
  return {close, open, total, rate: total ? close/total : 0};
}
/** topN(baris, field, n, kriteria) — Count of NO dikelompokkan per field,
 *  urut menurun, ambil n teratas. Nilai kosong diabaikan. */
function topN(baris, field, n=5, kriteria={}){
  const peta = new Map();
  saring(baris, kriteria).forEach(r=>{
    const k = normalize(r[field]); if(!k) return;
    peta.set(k, (peta.get(k)||0)+1);
  });
  const urut = [...peta.entries()].map(([n2,v])=>({n:n2, v})).sort((a,b)=>b.v-a.v);
  const total = urut.reduce((a,b)=>a+b.v,0);
  return {baris: n?urut.slice(0,n):urut, total, semua:urut};
}

/* ---------- format angka & tanggal gaya Indonesia ---------- */
const nID  = n => (Number(n)||0).toLocaleString("id-ID");
const pID  = (x,des=1) => (Number(x)*100).toFixed(des).replace(".",",")+"%";
const BULAN_SGKT = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const BULAN_XL   = ["JAN","FEB","MAR","APR","MEI","JUN","JUL","AUG","SEP","OKT","NOV","DES"];
/** tanggal gaya DD-MMM-YYYY dengan nama bulan Indonesia */
function fmtID(s){ const x=d(String(s||"").slice(0,10)); return x? `${String(x.getDate()).padStart(2,"0")}-${BULAN_SGKT[x.getMonth()]}-${x.getFullYear()}` : "—"; }

/* ---------- pemetaan kolom sumber → nama field internal ----------
   Sheet KTA dan TTA memakai urutan kolom yang BERBEDA (dan nama status
   yang berbeda pula). Pemetaan di bawah menyatukan keduanya sehingga
   seluruh perhitungan cukup satu fungsi.                               */
const PETA_KOLOM = {
  "NO":"no", "TGL. PELAPOR":"tgl", "DEPT. PELAPOR":"deptPelapor", "NRP PELAPOR":"nrpPelapor",
  "PELAPOR":"pelapor", "LEVEL":"level", "JABATAN PELAPOR":"jabPelapor", "POSISI PELAPOR":"posPelapor",
  "KATEGORI":"kategori", "LOKASI":"lokasi", "DETAIL LOKASI":"detail", "DESKRIPSI":"deskripsi",
  "DEPT. PIC":"deptPic", "NRP PIC":"nrpPic", "PIC":"pic", "JABATAN PIC":"jabPic", "POSISI PIC":"posPic",
  "STATUS PELAPORAN":"status", "STATUS":"status", "PERBAIKAN":"perbaikan", "IUP":"iup",
  /* sheet INSPEKSI & OBSERVASI */
  "NO.":"no", "TGL. INSPEKSI":"tgl", "NRP":"nrp", "NAMA":"nama", "DEPT":"dept",
  "INSPEKSI":"objek", "CATATAN":"catatan", "WEEK":"_week", "MONTH":"_month"
};
const fieldDari = judul => PETA_KOLOM[kunci(judul).replace(/\s+/g," ")] || null;

/** ubah satu baris array menjadi objek ber-nama-field + kolom turunan */
function bacaBaris(kolom, baris, jenis){
  const o = {jenis};
  kolom.forEach((judul,i)=>{
    const f = fieldDari(judul);
    if(f && !f.startsWith("_")) o[f] = normalize(baris[i]);
  });
  return lengkapi(o, jenis);
}
/** kolom turunan: WEEK, MONTH, IUP (inspeksi), umur, dan tanda baris valid */
function lengkapi(o, jenis){
  o.jenis = jenis || o.jenis;
  o.tgl   = normalize(o.tgl).slice(0,10);
  o.week  = weeknum(o.tgl, 2);          // = WEEKNUM(TGL;2)
  o.month = bulanDari(o.tgl);           // = MONTH(TGL)
  o.tahun = +String(o.tgl).slice(0,4) || 0;
  if(o.jenis==="INS" || o.jenis==="OBS"){
    if(o.jenis==="INS") o.iup = iupDari(o.lokasi);   // = LEFT(LOKASI;2)
    o.valid = !!(o.tgl && o.nama && o.objek);
  }else{
    o.umur  = o.status && kunci(o.status)==="CLOSE" ? ageInDays(o.tgl) : ageInDays(o.tgl);
    o.valid = !!(normalize(o.kategori) && normalize(o.lokasi) && normalize(o.deptPic) && normalize(o.pic));
  }
  return o;
}

/** bulanKunci(n) — daftar n bulan terakhir: {k:"2026-09", l:"Sep"} (dipakai filter periode) */
function bulanKunci(n=12){
  const out=[], c=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  for(let i=n-1;i>=0;i--){ const x=new Date(c.getFullYear(),c.getMonth()-i,1);

  return out;
}

/* ---------- pembantu indikator K3 ---------- */
function indikator(nama, tahun){
  const daftar = SDM.lagging[tahun||DSH.tahun]||[];
  const n = kunci(nama);
  return daftar.find(x=>kunci(x.item)===n) || daftar.find(x=>kunci(x.item).indexOf(n)===0) || daftar.find(x=>kunci(x.item).indexOf(n)>=0);
}
/** nilai indikator: bulan 0 berarti Year to Date */
function nilaiInd(nama, bulan, tahun){
  const x = indikator(nama, tahun); if(!x) return null;
  const b = bulan===undefined ? DSH.bulan : bulan;
  const v = b ? x.bulan[b-1] : x.ytd;
  return (v===null || v===undefined || v==="") ? null : v;
}
const adaTahun = t => !!(SDM.lagging[t] && SDM.lagging[t].some(x=>x.ytd!==null || x.bulan.some(v=>v!==null)));

function umurKaryawan(k){
  const t = d(String(k[K_LAHIR]).slice(0,10)); if(!t) return null;
  let u = TODAY.getFullYear()-t.getFullYear();
  if(TODAY.getMonth()<t.getMonth() || (TODAY.getMonth()===t.getMonth() && TODAY.getDate()<t.getDate())) u--;
  return u;
}
function hitungPer(idx, batas){
  const m = {};
  SDM.karyawan.forEach(k=>{ const v = normalize(k[idx])||"(kosong)"; m[v]=(m[v]||0)+1; });
  const arr = Object.entries(m).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  return batas ? arr.slice(0,batas) : arr;
}

/* ---------- penyaringan global ---------- */
function barisTemuan(){
  const f = MON.f;
  let baris = f.jenis==="KTA" ? MON.kta : f.jenis==="TTA" ? MON.tta : semuaTemuan();
  baris = baris.filter(r=>r.valid);                       // baris cacat dikarantina
  const q = normalize(f.q).toLowerCase();
  return baris.filter(r =>
    (!f.iup      || kunci(r.iup)===kunci(f.iup)) &&
    (!f.bulan.length || f.bulan.includes(r.month)) &&
    (!f.week     || r.week===+f.week) &&
    (!f.deptPic  || kunci(r.deptPic)===kunci(f.deptPic)) &&
    (!f.status   || kunci(r.status)===kunci(f.status)) &&
    (!f.kategori || kunci(r.kategori)===kunci(f.kategori)) &&
    (!f.lokasi   || kunci(r.lokasi)===kunci(f.lokasi)) &&
    (!f.umur7    || (kunci(r.status)==="OPEN" && r.umur>7)) &&
    (!q || [r.no,r.deskripsi,r.pic,r.pelapor,r.lokasi,r.kategori].join(" ").toLowerCase().includes(q))
  );
}
function urutkan(baris){
  const {k,dir} = MON.sort, m = dir==="asc"?1:-1;
  return baris.slice().sort((a,b)=>{
    const va=a[k], vb=b[k];
    if(typeof va==="number" && typeof vb==="number") return (va-vb)*m;
    return String(va||"").localeCompare(String(vb||""),"id")*m;
  });
}
function setSort(k){ MON.sort = {k, dir: MON.sort.k===k && MON.sort.dir==="desc" ? "asc":"desc"}; MON.hal=1; renderTemuan(); }
function setFilter(k,v){ MON.f[k]=v; MON.hal=1; MON.pilih.clear(); renderTemuan(); }
function toggleBulan(m){
  const i = MON.f.bulan.indexOf(m);
  if(i<0) MON.f.bulan.push(m); else MON.f.bulan.splice(i,1);
  MON.hal=1; renderTemuan();
}
function preset(p){
  const f = MON.f;
  f.bulan=[]; f.week=""; f.status=""; f.umur7=false; f.deptPic=""; f.kategori=""; f.lokasi=""; f.q="";
  if(p==="minggu"){ f.week = weeknum(TODAY,2); }
  if(p==="bulan"){ f.bulan = [TODAY.getMonth()+1]; }
  if(p==="open"){ f.status = "Open"; }
  if(p==="tua"){ f.status = "Open"; f.umur7 = true; }
  MON.hal=1; MON.pilih.clear(); renderTemuan();
}
function segarkan(){ bangunData(); gambarUlang(); toast("Data dihitung ulang dari baris mentah."); }

/* ---------- deret 9 bulan untuk sparkline KPI ---------- */
function deret9(fn){
  const m0 = TODAY.getMonth()+1, dari = Math.max(1, m0-8), out=[];
  for(let m=dari; m<=m0; m++) out.push(fn(m));
  return out;
}
function kpiTren(lb, nilai, sub, deret, warna, cls, ic, naikBaik){
  const a = deret[deret.length-1]||0, b = deret[deret.length-2]||0;
  const delta = a-b;
  const baik = naikBaik ? delta>=0 : delta<=0;
  const panah = delta===0 ? "→" : delta>0 ? "▲" : "▼";
  return `<div class="kpi ${cls||""}">
    <div class="lb"><span style="width:16px;height:16px;display:inline-block;color:var(--copper)">${ic||""}</span>${lb}</div>
    <div class="vl">${nilai}</div>
    <div class="dt">${sub} · <span style="color:${delta===0?"var(--muted)":baik?C_GREEN:C_RED};font-weight:700">${panah} ${Math.abs(Math.round(delta*10)/10).toString().replace(".",",")}</span> vs bulan lalu</div>
    ${spark(deret.map(v=>Math.max(0,v)), warna)}</div>`;
}

/* ---------- panel rekap KTA / TTA: total, open, close ----------
   Bisa dilihat per departemen PIC atau per bulan (tombol di atas panel). */
function panelRekap(jenis, baris){
  const r = closingRate(baris);
  const dims = MON.rekapMode==="bulan"
    ? [...Array(12)].map((_,i)=>({n:BULAN_SGKT[i], kri:{month:i+1}}))
    : nilaiUnik(baris,"deptPic").map(dp=>({n:dp, kri:{deptPic:dp}}));
  const isi = dims.map(x=>{ const c=closingRate(baris,x.kri); return {...x, ...c}; })
                  .filter(x=>MON.rekapMode==="bulan" ? true : x.total>0);
  const maks = Math.max(1, ...isi.map(x=>x.total));
  const warna = jenis==="KTA" ? "#1B7F4B" : "#EA7317";
  return `<div class="card"><div class="card-h"><h3>${jenis}</h3>
      <span class="sub">${MON.rekapMode==="bulan"?"per bulan":"per departemen PIC"}</span></div>
    <div class="card-b">
      <div class="bar" style="gap:18px;margin-bottom:12px">
        ${[["Total temuan", nID(r.total), "var(--navy)"],["Open", nID(r.open), "var(--red)"],
           ["Close", nID(r.close), "var(--green)"],["Closing rate", pID(r.rate), warnaRate(r.rate)]]
          .map(([l,v,c])=>`<div><div class="sub" style="font-size:11.5px">${l}</div>
            <b style="font-size:22px;color:${c};letter-spacing:-.02em">${v}</b></div>`).join("")}
      </div>
      <div class="tw"><table><thead><tr>
        <th>${MON.rekapMode==="bulan"?"Bulan":"Dept. PIC"}</th><th class="num">Total</th>
        <th class="num">Open</th><th class="num">Close</th><th style="min-width:110px">Closing rate</th></tr></thead>
        <tbody>${isi.map(x=>`<tr class="${x.open>0?"soon":""}">
          <td><b>${esc(x.n)}</b></td>
          <td class="num"><span class="pb" style="display:inline-block;width:46px;vertical-align:middle;margin-right:6px"><i style="width:${(x.total/maks*100).toFixed(0)}%;background:${warna}"></i></span>${nID(x.total)}</td>
          <td class="num" style="color:${x.open?"var(--red)":"inherit"};font-weight:${x.open?700:400}">${nID(x.open)}</td>
          <td class="num">${nID(x.close)}</td>
          <td>${x.total?`<div style="display:flex;gap:7px;align-items:center"><span class="pb" style="flex:1"><i style="width:${(x.rate*100).toFixed(0)}%;background:${warnaRate(x.rate)}"></i></span><b style="font-size:12px">${pID(x.rate)}</b></div>`:`<span class="sub">—</span>`}</td>
        </tr>`).join("")}</tbody></table></div>
    </div></div>`;
}

function pesanPIC(pic, baris){
  return `*Pengingat Temuan SHE — ${DATA.profil.jobsite}*\nKepada: ${pic}\nJumlah temuan open: ${baris.length}\n\n`+
    baris.slice(0,5).map(r=>`• ${r.no} (${r.jenis}, umur ${r.umur} hari)\n  ${r.deskripsi}\n  Lokasi: ${r.lokasi}`).join("\n")+
    (baris.length>5?`\n\n…dan ${baris.length-5} temuan lainnya.`:"")+
    `\n\nMohon segera ditindaklanjuti dan diisi kolom perbaikan. Terima kasih.`;

function cariHP(nama){
  const k = DATA.karyawan.find(x=>kunci(x[1])===kunci(nama));
  if(k && S.kontak[k[0]]) return S.kontak[k[0]];
  const dr = DATA.darurat.find(x=>kunci(x.nama)===kunci(nama));
  return dr ? dr.hp : "";
}

  const ada = baris.filter(r=>r.tgl).map(r=>r.tgl.slice(0,7)).sort();
  const p = ada[ada.length-1] || iso(TODAY).slice(0,7);
  return {kunci:p, bulan:+p.slice(5,7), tahun:+p.slice(0,4),
          label:`${BULAN_P[+p.slice(5,7)-1]} ${p.slice(0,4)}`};
}

/* ============ TAB 4 — KETERKAITAN ANTARMODUL ============ */
function tabKaitan(){
  const temuan = temuanSah();
  const lokTemuan = topN(temuan,"lokasi",0).semua;
  const lokInspeksi = topN(MON.ins,"lokasi",0).semua;
  const petaIns = new Map(lokInspeksi.map(x=>[kunci(x.n), x.v]));
  const petaTem = new Map(lokTemuan.map(x=>[kunci(x.n), x.v]));
  const gabungan = [...new Set([...lokTemuan.slice(0,12).map(x=>x.n), ...lokInspeksi.slice(0,12).map(x=>x.n)])]
    .map(n=>({n, temuan:petaTem.get(kunci(n))||0, inspeksi:petaIns.get(kunci(n))||0}))
    .sort((a,b)=>(b.temuan+b.inspeksi)-(a.temuan+a.inspeksi)).slice(0,12);
  const maxT = Math.max(1,...gabungan.map(x=>x.temuan)), maxI = Math.max(1,...gabungan.map(x=>x.inspeksi));

  const dept = nilaiUnik(temuan,"deptPic");
  const rasio = dept.map(dp=>{
    const t = countIfs(temuan,{deptPic:dp});
    const i = countIfs(MON.ins,{dept:dp});
    const o = countIfs(MON.obs,{dept:v=>kunci(v).includes(kunci(dp))});
    return {dept:dp, temuan:t, pengawasan:i+o, rasio: t? (i+o)/t : null};
  }).sort((a,b)=>(a.rasio??99)-(b.rasio??99));

  $("#tabIsi").innerHTML = `
  ${bedaPeriode()}
  <div class="card mt"><div class="card-h"><h3>Lokasi: banyak diinspeksi vs banyak bertemuan</h3>
    <span class="sub">apakah area yang sering diinspeksi memang area bertemuan tinggi?</span></div>
    <div class="card-b"><div class="tw"><table>
      <thead><tr><th>Lokasi</th><th style="min-width:160px">Temuan KTA/TTA</th><th style="min-width:160px">Inspeksi</th><th>Bacaan</th></tr></thead>
      <tbody>${gabungan.map(x=>{
        const bacaan = x.temuan && !x.inspeksi ? `<span class="bg bg-r">Banyak temuan, belum diinspeksi</span>`
          : x.inspeksi && !x.temuan ? `<span class="bg bg-n">Rutin diinspeksi, nihil temuan</span>`
          : x.temuan > x.inspeksi*2 ? `<span class="bg bg-a">Inspeksi perlu ditambah</span>`
          : `<span class="bg bg-g">Seimbang</span>`;
        return `<tr><td><b>${esc(x.n)}</b></td>
          <td><div style="display:flex;gap:8px;align-items:center"><span class="pb" style="flex:1"><i style="width:${x.temuan/maxT*100}%;background:${C_COPPER}"></i></span><b>${nID(x.temuan)}</b></div></td>
          <td><div style="display:flex;gap:8px;align-items:center"><span class="pb" style="flex:1"><i style="width:${x.inspeksi/maxI*100}%;background:${C_NAVY}"></i></span><b>${nID(x.inspeksi)}</b></div></td>
          <td>${bacaan}</td></tr>`;}).join("")}
      </tbody></table></div>
      <div class="sub mt">Perbandingan lintas periode (temuan 2026, inspeksi 2025) — gunakan sebagai petunjuk arah, bukan angka mutlak.</div>
    </div></div>

  <div class="card mt"><div class="card-h"><h3>Rasio pengawasan per departemen</h3>
    <span class="sub">(inspeksi + observasi) ÷ jumlah temuan</span></div>
    <div class="card-b"><div class="tw"><table>
      <thead><tr><th>Departemen</th><th class="num">Temuan</th><th class="num">Inspeksi + observasi</th><th class="num">Rasio</th><th>Penilaian</th></tr></thead>
      <tbody>${rasio.map(x=>`<tr class="${x.rasio!==null&&x.rasio<.5?"over":""}">
        <td><b>${esc(x.dept)}</b></td><td class="num">${nID(x.temuan)}</td><td class="num">${nID(x.pengawasan)}</td>
        <td class="num">${x.rasio===null?"—":x.rasio.toFixed(2).replace(".",",")}</td>
        <td>${x.rasio===null?"—": x.rasio<.5?`<span class="bg bg-r">Pengawasan tertinggal</span>`: x.rasio<1?`<span class="bg bg-a">Perlu ditambah</span>`:`<span class="bg bg-g">Memadai</span>`}</td></tr>`).join("")}
      </tbody></table></div></div></div>`;
}

/** tentukan jenis dokumen dari nama folder atau nama berkas */
function jenisDok(teks){
  const t = kunci(teks);
  if(/INSTRUKSI KERJA|\bIK\b|^IK[-_ ]/.test(t)) return "Instruksi Kerja";
  if(/STANDAR OPERASIONAL|\bSOP\b/.test(t))     return "SOP";
  return "Lainnya";
}
/** muat daftar dokumen: dari Drive bila halaman dijalankan lewat Apps Script */
function muatDokumen(paksa){
  if(REPO.siap && !paksa) return Promise.resolve(REPO.dokumen);
  if(window.google && google.script && google.script.run && typeof server==="function"){
    REPO.sumber = "drive";
    return server("bacaDokumen").then(d=>{
      const semua = d||[];
      const pesanGalat = semua.filter(x=>x.galat).map(x=>x.galat).join(" · ");
      REPO.dokumen = semua.filter(x=>x.judul);
      REPO.pesan = pesanGalat || "";
      REPO.siap = true; REPO.ts = new Date();
      if(S.halaman==="dokumen") renderDokumen();
      return REPO.dokumen;
    }).catch(e=>{
      REPO.siap = true; REPO.pesan = e && e.message ? e.message : String(e);
      if(S.halaman==="dokumen") renderDokumen();
      return [];
    });
  }
  /* mode pratinjau (berkas HTML biasa): pakai daftar manual pada DATA.dokumen */
  REPO.sumber = "manual";
  REPO.dokumen = DATA.dokumen.map(x=>({
    judul:x.judul, nomor:x.no, jenis:jenisDok(x.kat+" "+x.no), dept:x.dept,
    folder:"(entri manual)", link:"", unduh:"", diperbarui:x.terbit, ukuran:0, manual:true
  }));
  REPO.siap = true; REPO.ts = new Date();
  return Promise.resolve(REPO.dokumen);
}
function dokumenTersaring(){
  const f = S.fD, q = normalize(f.q).toLowerCase();
  return REPO.dokumen.filter(x =>
    (!f.dept   || kunci(x.dept)===kunci(f.dept)) &&
    (!f.kat    || kunci(x.jenis)===kunci(f.kat)) &&
    (!q || [x.judul, x.nomor, x.folder, x.dept].join(" ").toLowerCase().includes(q))
  ).sort((a,b)=>{
    const s = (a.dept||"").localeCompare(b.dept||"","id");
    return s || (a.judul||"").localeCompare(b.judul||"","id");
  });
}

const ukuranDok = b => !b ? "" : b>1048576 ? (b/1048576).toFixed(1).replace(".",",")+" MB" : Math.max(1,Math.round(b/1024))+" KB";

/* =====================================================================
   [6] TAMBAH / UBAH / HAPUS — TEMUAN, INSPEKSI, OBSERVASI, TRAINING
   ===================================================================== */
const KUNCI_KOL = {KTA:"kta", TTA:"tta", INS:"ins", OBS:"obs"};
const cariTemuan = no => semuaTemuan().find(r=>kunci(r.no)===kunci(no));
const cariBaris  = (kol,no) => ({kta:MON.kta, tta:MON.tta, ins:MON.ins, obs:MON.obs}[kol]||[]).find(r=>kunci(r.no)===kunci(no));

/* ---------- penomoran otomatis mengikuti pola berkas sumber ---------- */
function nomorTemuanBaru(jenis, tglStr){
  const t = d(String(tglStr||"").slice(0,10)) || TODAY;
  const pre = `${String(t.getFullYear()).slice(2)}${String(t.getMonth()+1).padStart(2,"0")}/${jenis==="KTA"?"PKTA":"PTTA"}/`;
  const sumber = jenis==="KTA" ? MON.kta : MON.tta;
  let maks = 0;
  sumber.forEach(r=>{ const s=String(r.no||""); if(s.startsWith(pre)){ const n=parseInt(s.slice(pre.length),10); if(n>maks) maks=n; } });
  return pre + String(maks+1).padStart(5,"0");
}
function nomorSurveiBaru(tipe, tglStr){          // tipe: TINS (inspeksi) / TOBS (observasi)
  const t = d(String(tglStr||"").slice(0,10)) || TODAY;
  const pre = `KT09/SHE/${String(t.getFullYear()).slice(2)}${String(t.getMonth()+1).padStart(2,"0")}/${tipe}/`;
  const sumber = tipe==="TINS" ? MON.ins : MON.obs;
  let maks = 0;
  sumber.forEach(r=>{ const s=String(r.no||""); if(s.startsWith(pre)){ const n=parseInt(s.slice(pre.length),10); if(n>maks) maks=n; } });
  return pre + String(maks+1).padStart(5,"0");
}

/* ---------- penulisan perubahan ke selisih tersimpan ---------- */
function catatRiwayat(lama, baru){
  const jejak = [];
  Object.keys(baru).forEach(k=>{
    if(k.startsWith("_")) return;
    if(normalize(lama?.[k]) !== normalize(baru[k])) jejak.push({k, dari:normalize(lama?.[k]), ke:normalize(baru[k])});
  });
  return jejak.length ? [{tgl:new Date().toISOString(), ubah:jejak}] : [];
}
/* simpanUbahan(), tambahBarisBaru(), dan hapusBarisMon() didefinisikan di blok [8]
   karena menulis langsung ke Google Sheets. */
/* toast dengan tombol Urungkan selama 10 detik */
function urungkan(pesan, aksi){
  const t = $("#toast");
  t.innerHTML = `${esc(pesan)} <button class="btn btn-sm" style="margin-left:10px" id="btnUrung">Urungkan</button>`;
  t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.classList.remove("on"); t.textContent=""; }, 10000);
  $("#btnUrung").onclick = ()=>{ aksi(); t.classList.remove("on"); t.textContent=""; clearTimeout(t._t); };
}

/* ---------- edit inline pada tabel ---------- */
function ubahInline(no, jenis, kolom, nilai){
  const kol = KUNCI_KOL[jenis];
  const baris = cariBaris(kol, no);
  if(kolom==="status" && kunci(nilai)==="CLOSE" && kol!=="obs" && !normalize(baris.perbaikan)){
    const isi = prompt(`Menutup ${no} memerlukan catatan perbaikan.\nTuliskan tindakan perbaikan yang sudah dilakukan:`, "");
    if(!isi || !isi.trim()){ toast("Status tidak diubah — kolom perbaikan wajib diisi."); renderTemuan(); return; }
    simpanUbahan(kol, no, {status:"Close", perbaikan:isi.trim()});
    toast(`${no} ditutup.`); return;
  }
  simpanUbahan(kol, no, {[kolom]:nilai});
  toast(`${no} diperbarui.`);
}

/* ---------- aksi massal ---------- */
function terapkanMassal(){
  const st = $("#massalStatus").value, pic = $("#massalPIC").value;
  if(!st && !pic){ toast("Pilih status atau PIC pengganti terlebih dahulu."); return; }
  if(st && kunci(st)==="CLOSE"){
    const isi = prompt(`Menutup ${MON.pilih.size} temuan sekaligus memerlukan catatan perbaikan yang sama:`, "");
    if(!isi || !isi.trim()){ toast("Dibatalkan — kolom perbaikan wajib diisi."); return; }
    var perbaikan = isi.trim();
  }
  const daftar = [...MON.pilih];
  const cadangan = daftar.map(no=>{ const r=cariTemuan(no); return {no, status:r?.status, pic:r?.pic, perbaikan:r?.perbaikan, kol:KUNCI_KOL[r?.jenis]}; });
  daftar.forEach(no=>{
    const r = cariTemuan(no); if(!r) return;
    const obj = {};
    if(st){ obj.status = st; if(perbaikan) obj.perbaikan = perbaikan; }
    if(pic){
      obj.pic = pic;
      const k = DATA.karyawan.find(x=>kunci(x[1])===kunci(pic));
      if(k){ obj.nrpPic = k[0]; obj.jabPic = k[3]; obj.posPic = k[4]; }
      const asal = semuaTemuan().find(x=>kunci(x.pic)===kunci(pic) && normalize(x.deptPic));
      if(asal) obj.deptPic = asal.deptPic;
    }
    simpanUbahan(KUNCI_KOL[r.jenis], no, obj, true);
  });
  MON.pilih.clear(); renderTemuan();
  urungkan(`${daftar.length} baris diperbarui.`, ()=>{
    cadangan.forEach(c=> simpanUbahan(c.kol, c.no, {status:c.status, pic:c.pic, perbaikan:c.perbaikan}, true));
    renderTemuan(); toast("Perubahan massal dibatalkan.");
  });
}
function hapusMassal(){
  const daftar = [...MON.pilih];
  if(!confirm(`Hapus ${daftar.length} baris terpilih?`)) return;
  if(!confirm(`Konfirmasi terakhir: ${daftar.length} baris akan dihapus. Tersedia tombol Urungkan selama 10 detik.`)) return;
  const cadangan = daftar.map(no=>{ const r=cariTemuan(no); return {kol:KUNCI_KOL[r.jenis], data:JSON.parse(JSON.stringify(r))}; });
  daftar.forEach(no=>{ const r=cariTemuan(no); if(r) hapusBarisMon(KUNCI_KOL[r.jenis], no, true); });
  MON.pilih.clear(); renderTemuan();
  urungkan(`${daftar.length} baris dihapus.`, ()=>{
    cadangan.forEach(c=>{

    temuan:{kategori:nilaiUnik(T,"kategori"), lokasi:nilaiUnik(T,"lokasi"), deptPelapor:nilaiUnik(T,"deptPelapor"),

async function simpanForm(){
  if(!editKonteks) return;
  const {bentuk, kunci:kk} = editKonteks;
  const obj = {};
  for(const f of FIELD[bentuk]){
    const el = $("#f_"+f.k); if(!el) continue;
    let v = f.t==="number" ? (+el.value||0) : normalize(el.value);
    if(f.req && (v===""||v===null)){ toast(`Kolom "${f.l}" wajib diisi.`); el.focus(); return; }
    obj[f.k] = v;
  }
  if(bentuk!=="training" && bentuk!=="inspeksi" && kunci(obj.status)==="CLOSE" && !normalize(obj.perbaikan||obj.lokasi)){
    toast("Status Close mewajibkan kolom perbaikan diisi."); $("#f_perbaikan")?.focus(); return;
  }
  if(bentuk==="training"){
    if(!Store.ready){ toast("Penyimpanan belum siap, coba sesaat lagi."); return; }
    const id = await Store.simpan("training", {...obj, _id:kk||undefined});
    const i = S.training.findIndex(x=>x._id===id);
    if(i>=0) S.training[i] = {...obj,_id:id}; else S.training.push({...obj,_id:id});
    closeOv("ovForm"); gambarUlang(); toast(kk?"Perubahan tersimpan.":"Training baru tersimpan."); return;
  }
  const kol = bentuk==="temuan" ? KUNCI_KOL[obj.jenis] : bentuk==="inspeksi" ? "ins" : "obs";
  if(kk){
    const lama = cariBaris(bentuk==="temuan"?KUNCI_KOL[editKonteks.jenisLama]:kol, kk);
    if(bentuk==="temuan" && editKonteks.jenisLama !== obj.jenis){   // pindah sheet KTA <-> TTA
      hapusBarisMon(KUNCI_KOL[editKonteks.jenisLama], kk, true);
      tambahBarisBaru(kol, lengkapi({...lama, ...obj}, obj.jenis));
    }else{
      simpanUbahan(kol, kk, obj, true);
    }
  }else{
    if(cariBaris(kol, obj.no)){ toast(`Nomor ${obj.no} sudah dipakai. Ganti nomornya.`); return; }
    tambahBarisBaru(kol, lengkapi({...obj}, bentuk==="temuan"?obj.jenis: bentuk==="inspeksi"?"INS":"OBS"));
  }
  closeOv("ovForm"); renderTemuan();
  toast(kk ? "Perubahan tersimpan di peramban." : "Data baru tersimpan di peramban.");
}

  await Store.hapus("training", id);

function bacaBerkas(file){
  if(!file) return;
  $("#imporPratinjau").innerHTML = `<div class="sub">Membaca ${esc(file.name)}…</div>`;

function muatSheetJS(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((ok,gagal)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=ok; s.onerror=gagal; document.head.appendChild(s); });
}
function parseCSV(teks){
  const baris=[]; let f="", r=[], q=false;
  teks = teks.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const baris1 = teks.split("\n")[0]||"";
  const pemisah = baris1.split(";").length > baris1.split(",").length ? ";" : ",";
  for(let i=0;i<teks.length;i++){
    const c=teks[i];
    if(q){ if(c==='"'){ if(teks[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===pemisah){ r.push(f); f=""; }
    else if(c==="\n"){ r.push(f); baris.push(r); r=[]; f=""; }
    else f+=c;
  }
  if(f||r.length){ r.push(f); baris.push(r); }
  return baris.filter(x=>x.some(y=>String(y).trim()!==""));
}
const bungkusCSV = v => { const s=String(v??""); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
function normTanggal(v){
  if(!v) return "";
  if(v instanceof Date && !isNaN(v)) return iso(v);
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let [,a,b,c]=m; if(c.length===2) c="20"+c; return `${c}-${String(b).padStart(2,"0")}-${String(a).padStart(2,"0")}`; }
  if(/^\d{5}$/.test(s)){ return iso(new Date(Date.UTC(1899,11,30)+(+s)*86400000)); }   // serial Excel
  const x = new Date(s); return isNaN(x)?"":iso(x);
}

/** server("namaFungsi", argumen…) — memanggil fungsi di Code.gs */
function server(fn){
  const args = [].slice.call(arguments, 1);
  return new Promise((ok, gagal)=>{
    if(!(window.google && google.script && google.script.run)){
      gagal(new Error("Halaman harus dibuka melalui alamat Web App Apps Script."));
      return;
    }
    GAS.sibuk++; tandaSibuk();
    google.script.run
      .withSuccessHandler(v=>{ GAS.sibuk--; tandaSibuk(); ok(v); })
      .withFailureHandler(e=>{ GAS.sibuk--; tandaSibuk(); toast("Gagal menyimpan: "+(e && e.message ? e.message : e)); gagal(e); })
      [fn].apply(null, args);
  });
}
function tandaSibuk(){
  const c = $("#saveChip"); if(!c) return;
  c.classList.toggle("local", GAS.sibuk>0);

  const jejak = catatRiwayat(baris, obj);

  lengkapi(baris, baris.jenis);
  baris._riwayat = (baris._riwayat||[]).concat(jejak.map(h=>({...h, oleh:GAS.user})));
  server("simpanBaris", SHEET_DARI[kol], no, bersihObj(obj)).catch(()=>{});
  if(!diam) renderTemuan();
}
function tambahBarisBaru(kol, obj){
  obj._riwayat = [{tgl:new Date().toISOString(), oleh:GAS.user, ubah:[{k:"baris", dari:"", ke:"dibuat lewat dashboard"}]}];
  ({kta:MON.kta, tta:MON.tta, ins:MON.ins, obs:MON.obs}[kol]).push(obj);
  server("tambahBaris", SHEET_DARI[kol], bersihObj(obj)).catch(()=>{});
}
function hapusBarisMon(kol, no, diam){
  const baris = cariBaris(kol, no); if(!baris) return;
  if(!diam && !confirm(`Hapus baris ${no}?\n\nTekan OK untuk lanjut ke konfirmasi terakhir.`)) return;
  if(!diam && !confirm(`Konfirmasi terakhir — baris ${no} akan dihapus dari Google Sheets.\nAnda masih bisa membatalkannya selama 10 detik.`)) return;
  const salinan = JSON.parse(JSON.stringify(baris));
  const daftar = {kta:MON.kta, tta:MON.tta, ins:MON.ins, obs:MON.obs}[kol];
  const i = daftar.findIndex(r=>kunci(r.no)===kunci(no));
  if(i>=0) daftar.splice(i,1);
  server("hapusBaris", SHEET_DARI[kol], no).catch(()=>{});
  renderTemuan();
  urungkan(`Baris ${no} dihapus.`, ()=>{
    daftar.push(salinan);
    server("tambahBaris", SHEET_DARI[kol], bersihObj(salinan)).catch(()=>{});
    renderTemuan(); toast("Penghapusan dibatalkan.");
  });
}

/* ---------- impor: dikirim sekaligus dalam satu panggilan ---------- */
async function simpanImpor(){
  if(!imporData || !imporData.length) return;
  const lewati = $("#impLewati")?.checked;
  const tb = $("#btnImporSimpan"); tb.disabled = true; tb.textContent = "Menyimpan…";
  try{
    const dipakai = imporData.filter(o => !(lewati && o._masalah.some(m=>!m.startsWith("duplikat"))));
    if(imporJenis==="kontak"){
      dipakai.forEach(o=>{ S.kontak[o.nrp] = o.hp; });
      await server("simpanKontak", S.kontak);
    }else if(imporJenis==="training"){
      for(const o of dipakai){
        const rec = {...bersihObj(o), _id:kunciDok("training", o)};
        await server("simpanTraining", rec);
        const i = S.training.findIndex(x=>x._id===rec._id);
        if(i>=0) S.training[i]=rec; else S.training.push(rec);
      }
    }else{
      const kelompok = {};
      dipakai.forEach(o=>{
        const kol = imporJenis==="temuan" ? KUNCI_KOL[o.jenis] : imporJenis==="inspeksi" ? "ins" : "obs";
        (kelompok[kol] = kelompok[kol]||[]).push(bersihObj(o));
      });
      for(const kol of Object.keys(kelompok)) await server("simpanBanyak", SHEET_DARI[kol], kelompok[kol]);
      await muatUlang(true);
    }
    closeOv("ovImport"); gambarUlang();
    toast(`${nID(dipakai.length)} baris berhasil disimpan ke Google Sheets.`);
  }catch(e){ toast("Sebagian data gagal disimpan — coba berkas yang lebih kecil."); }
  tb.disabled = false; tb.textContent = "Simpan hasil impor";
}

/** muatSDM() — ambil ulang DATABASE KARYAWAN, LAGGING LEADING INDIKATOR,
 *  dan PERUSAHAAN JASA langsung dari spreadsheet sumber. */
function muatSDM(diam){
  if(!(window.google && google.script && google.script.run)){
    toast("Pembacaan langsung dari Google Sheet hanya aktif pada versi Apps Script.");
    return Promise.resolve();
  }
  return server("bacaSDM").then(sdm=>{
    if(sdm && sdm.karyawan && sdm.karyawan.length){
      SDM.karyawan = sdm.karyawan;
      DATA.karyawan = sdm.karyawan.map(k=>[k[0],k[1],k[2],k[3],k[4],k[5]]);
      DATA.profil.jumlahKaryawan = sdm.karyawan.length;
      sdm.karyawan.forEach(k=>{ if(k[6] && !S.kontak[k[0]]) S.kontak[k[0]] = k[6]; });
    }
    if(sdm && sdm.lagging && Object.keys(sdm.lagging).length) SDM.lagging = sdm.lagging;
    if(sdm && sdm.mitra) SDM.mitra = sdm.mitra;
    SDM.ts = new Date().toLocaleTimeString("id-ID");
    gambarUlang();
    if(!diam) toast(`Data SDM diperbarui — ${nID(SDM.karyawan.length)} karyawan, ${nID(SDM.mitra.length)} mitra kerja.`);
  }).catch(e=>{ if(!diam) toast("Gagal memuat data SDM: "+(e.message||e)); });
}

   [9] INFOGRAFIS PRIORITAS TINDAK LANJUT
   Poster siap kirim (WhatsApp / rapat) berisi 5 prioritas:
   area paling berbahaya, lokasi inspeksi terbanyak, dan temuan paling
   sering muncul. Digambar sebagai SVG lalu bisa diunduh sebagai PNG.
   ===================================================================== */
const POSTER = {W:1080, H:1440};

/** kumpulkan bahan prioritas dari data yang sedang tampil */
function bahanPrioritas(){
  const f = MON.f;
  const kriBulan = f.bulan.length ? {month:v=>f.bulan.includes(v)} : {};
  const temuan = saring(temuanSah(), {...(f.iup?{iup:f.iup}:{}), ...kriBulan});
  const open   = temuan.filter(r=>kunci(r.status)==="OPEN");
  const area   = topN(temuan, "lokasi", 5).semua.slice(0,5).map(x=>({
    ...x, open: open.filter(r=>kunci(r.lokasi)===kunci(x.n)).length }));
  const iupIns = MON.fi.iup || f.iup;            // inspeksi ikut IUP yang sedang dipilih
  const inspeksi = topN(MON.ins, "lokasi", 5,
    {...(iupIns?{iup:iupIns}:{}), ...(MON.fi.bulan?{month:+MON.fi.bulan}:{})}).semua.slice(0,5);
  const kategori = topN(temuan, "kategori", 5).semua.slice(0,5);
  const rK = closingRate(saring(MON.kta.filter(r=>r.valid), f.iup?{iup:f.iup}:{}));
  const rT = closingRate(saring(MON.tta.filter(r=>r.valid), f.iup?{iup:f.iup}:{}));
  return {temuan, open, area, inspeksi, kategori, rK, rT, iupIns,
    periode: f.bulan.length ? f.bulan.map(m=>BULAN_P[m-1]).join(", ") : "Seluruh periode",
    iup: f.iup || "MC + LC"};
}

/** ubah poster SVG menjadi berkas PNG resolusi 2× lalu unduh */
function unduhInfografis(){
  const svg = svgInfografis();
  const blob = new Blob([svg], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = POSTER.W*2; c.height = POSTER.H*2;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#F5FAF4"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>simpanGambar(b, `prioritas-she-${iso(TODAY)}.png`, "Infografis prioritas siap disimpan"), "image/png");
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Gambar gagal dibuat, coba gunakan tombol Cetak / PDF."); };
  img.src = url;
}

  alinea: {kanan:1296, y:793, tinggi:40, ukuran:27, warna:"#1F2937"},
  tanggal:{kiri:336, y:915, ukuran:24, warna:"#374151"},
  nilai:  {kiri:336, y:962, ukuran:26, warna:"#111827"},
  status: {kiri:336, y:980, tinggi:44, ukuran:24}
};
const NILAI_LULUS = 80;                     // nilai di ATAS angka ini dinyatakan lulus
const statusNilai = n => (Number(n) > NILAI_LULUS) ? "LULUS" : "TIDAK LULUS";
const SERT = {peserta:"", nrpAlamtri:"", jenis:"", tanggal:iso(TODAY), nomor:"", nilai:"", email:"", riwayat:[], sibuk:false};

const fontSert = (ukuran, tebal, miring) =>
  `${miring?"italic ":""}${tebal||"400"} ${ukuran}px "Plus Jakarta Sans", Poppins, Arial, sans-serif`;
const namaKaryawan = nrp => (SDM.karyawan.find(k=>k[0]===nrp)||[])[1] || "";

/** susun kalimat sertifikat; jenis training disisipkan seperti pada contoh resmi */
function kalimatSertifikat(jenis){
  return `Atas Kelulusan mengikuti pelatihan ${normalize(jenis)||"…"} yang di laksanakan oleh PT `+
         `Putra Perkasa Abadi Jobsite Alamtri Mineral Indonesia - Maruwai Coal.`;
}
/** pecah teks menjadi beberapa baris sesuai lebar maksimum kanvas */
function pecahBaris(ctx, teks, lebarMaks){
  const kata = teks.split(" "), baris = [];
  let kini = "";
  kata.forEach(w=>{
    const uji = kini ? kini+" "+w : w;
    if(ctx.measureText(uji).width > lebarMaks && kini){ baris.push(kini); kini = w; }
    else kini = uji;
  });
  if(kini) baris.push(kini);
  return baris;
}

/** gambar sertifikat ke kanvas; mengembalikan Promise<canvas> */
function gambarSertifikat(data){
  return new Promise((ok, gagal)=>{
    const img = new Image();
    img.onload = () => {
      const T = TATA_SERT;
      const c = document.createElement("canvas");
      c.width = T.lebar; c.height = T.tinggi;
      const x = c.getContext("2d");
      x.drawImage(img, 0, 0, T.lebar, T.tinggi);

      /* nama peserta */
      x.fillStyle = T.nama.warna; x.textAlign = "center";
      x.font = fontSert(T.nama.ukuran, T.nama.tebal);
      x.fillText(namaKaryawan(data.peserta) || normalize(data.peserta) || "Nama Peserta", T.nama.x, T.nama.y);

      /* nomor sertifikat + NRP Alamtri */
      const ket = [data.nomor && "No. "+normalize(data.nomor), data.nrpAlamtri && "NRP "+normalize(data.nrpAlamtri)]
        .filter(Boolean).join("   ·   ");
      if(ket){ x.fillStyle = T.nomor.warna; x.font = fontSert(T.nomor.ukuran); x.fillText(ket, T.nomor.x, T.nomor.y); }

      /* tulis ulang alinea dengan nama pelatihan di dalamnya */
      x.fillStyle = "#FFFFFF";
      x.fillRect(T.hapus.x, T.hapus.y, T.hapus.w, T.hapus.h);
      x.fillStyle = T.alinea.warna; x.textAlign = "right";
      x.font = fontSert(T.alinea.ukuran, "400", true);
      pecahBaris(x, kalimatSertifikat(data.jenis), T.hapus.w-18).slice(0,4)
        .forEach((b,i)=> x.fillText(b, T.alinea.kanan, T.alinea.y + i*T.alinea.tinggi));

      /* tanggal pelaksanaan, nilai, dan status kelulusan */
      x.textAlign = "left";
      if(data.tanggal){
        x.fillStyle = T.tanggal.warna; x.font = fontSert(T.tanggal.ukuran);
        x.fillText(`Maruwai Coal, ${fmtL(data.tanggal).split(", ")[1]||fmtID(data.tanggal)}`, T.tanggal.kiri, T.tanggal.y);
      }
      if(normalize(data.nilai)!==""){
        const n = Number(data.nilai), lulus = statusNilai(n)==="LULUS";
        x.fillStyle = T.nilai.warna; x.font = fontSert(T.nilai.ukuran, "700");
        x.fillText(`Nilai post test : ${n}`, T.nilai.kiri, T.nilai.y);
        /* label status */
        x.font = fontSert(T.status.ukuran, "700");
        const teks = statusNilai(n);
        const lebar = x.measureText(teks).width + 44;
        const X = T.status.kiri, Y = T.status.y, H2 = T.status.tinggi, R = 14;
        x.beginPath();
        x.moveTo(X+R, Y); x.lineTo(X+lebar-R, Y); x.quadraticCurveTo(X+lebar, Y, X+lebar, Y+R);
        x.lineTo(X+lebar, Y+H2-R); x.quadraticCurveTo(X+lebar, Y+H2, X+lebar-R, Y+H2);
        x.lineTo(X+R, Y+H2); x.quadraticCurveTo(X, Y+H2, X, Y+H2-R);
        x.lineTo(X, Y+R); x.quadraticCurveTo(X, Y, X+R, Y); x.closePath();
        x.fillStyle = lulus ? "#E4F7E9" : "#FDECEC"; x.fill();
        x.lineWidth = 2; x.strokeStyle = lulus ? "#16A34A" : "#DC2626"; x.stroke();
        x.fillStyle = lulus ? "#15803D" : "#B91C1C"; x.textAlign = "center";
        x.fillText(teks, X + lebar/2, Y + H2 - 13);
      }
      ok(c);
    };
    img.onerror = () => gagal(new Error("Template sertifikat gagal dimuat."));
    img.src = TPL_SERTIFIKAT;
  });
}

/** perbarui pratinjau di halaman */
async function pratinjauSertifikat(){
  const kotak = $("#pratinjauSert"); if(!kotak) return;
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const c = await gambarSertifikat(SERT);
    kotak.innerHTML = "";
    c.style.cssText = "width:100%;height:auto;display:block;border-radius:12px";
    kotak.appendChild(c);
  }catch(e){ kotak.innerHTML = `<div class="empty">${ICO.kosong}<div>${esc(e.message)}</div></div>`; }
}
function ubahSert(k, v){
  SERT[k] = v;
  if(k==="peserta"){
    const kar = SDM.karyawan.find(x=>x[0]===v);
    SERT.nrpAlamtri = kar ? kar[K_ALAMTRI] : "";
    SERT.email = kar ? kar[10] : "";
    const a = $("#f_alamtri"), e = $("#f_emailSert");
    if(a) a.value = SERT.nrpAlamtri;
    if(e) e.value = SERT.email;
  }
  pratinjauSertifikat();
}

/* ---------- unduh & kirim ---------- */
async function unduhSertifikat(){
  if(!SERT.peserta){ toast("Pilih nama peserta terlebih dahulu."); return; }
  const c = await gambarSertifikat(SERT);
  const nama = `sertifikat-${slug(namaKaryawan(SERT.peserta)||"peserta")}-${SERT.tanggal}.png`;
  c.toBlob(b=>simpanGambar(b, nama, "Sertifikat siap disimpan"), "image/png");
  catatSertifikat("DIUNDUH");
}

/** dataSertifikat() — satu bentuk data untuk dikirim, dicatat, dan ditampilkan */
function dataSertifikat(status){
  return {
    nama: namaKaryawan(SERT.peserta), nrp: SERT.peserta, nrpAlamtri: SERT.nrpAlamtri,
    jenis: normalize(SERT.jenis), tanggal: SERT.tanggal, nomor: normalize(SERT.nomor),
    nilai: normalize(SERT.nilai), hasil: normalize(SERT.nilai)!=="" ? statusNilai(SERT.nilai) : "",
    email: normalize($("#f_emailSert")?.value || SERT.email), status: status || "",
    waktu: new Date().toISOString().slice(0,16).replace("T"," ")
  };
}
/** catat riwayat penerbitan sertifikat ke sheet LOG SERTIFIKAT (atau peramban) */
function catatSertifikat(status){
  const d2 = dataSertifikat(status);
  SERT.riwayat.push(d2);
  if(window.google && google.script && google.script.run){
    server("catatSertifikat", {...d2, status:status})
      .then(()=>muatRiwayatSertifikat(true)).catch(()=>{});
  }else{
    try{
      const kunciLokal = "she_sert_log";
      const lama = JSON.parse(localStorage.getItem(kunciLokal)||"[]");
      lama.push(d2); localStorage.setItem(kunciLokal, JSON.stringify(lama.slice(-300)));
    }catch(e){}
    renderTraining();
  }
}
async function cetakSertifikat(){
  const c = await gambarSertifikat(SERT);
  const w = window.open("", "_blank");
  if(!w){ toast("Izinkan pop-up untuk mencetak."); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Sertifikat</title>
    <style>@page{size:A4 landscape;margin:0}body{margin:0}img{width:100%;display:block}</style></head>
    <body><img src="${c.toDataURL("image/png")}"><script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}
async function kirimSertifikat(){
  if(!SERT.peserta){ toast("Pilih nama peserta terlebih dahulu."); return; }
  if(!normalize(SERT.jenis)){ toast("Isi jenis training terlebih dahulu."); $("#f_jenisSert")?.focus(); return; }
  const email = normalize($("#f_emailSert")?.value || SERT.email);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Alamat email peserta belum benar."); $("#f_emailSert")?.focus(); return; }
  if(!(window.google && google.script && google.script.run)){
    toast("Pengiriman email hanya berjalan pada versi Apps Script."); return;
  }
  SERT.sibuk = true; renderTraining();
  try{
    const c = await gambarSertifikat(SERT);
    const base64 = c.toDataURL("image/png").split(",")[1];
    const kirim = {...dataSertifikat("TERKIRIM"), email, status: normalize(SERT.nilai)!=="" ? statusNilai(SERT.nilai) : ""};
    const hasil = await server("kirimSertifikat", kirim, base64);
    toast(hasil && hasil.ok ? `Sertifikat terkirim ke ${email}` : "Pengiriman gagal.");
    muatRiwayatSertifikat(true);
  }catch(e){ toast("Gagal mengirim: "+(e.message||e)); }
  SERT.sibuk = false; renderTraining();
}
function muatRiwayatSertifikat(paksa){
  if(!(window.google && google.script && google.script.run)){
    try{
      const lokal = JSON.parse(localStorage.getItem("she_sert_log")||"[]");
      if(lokal.length && lokal.length !== SERT.riwayat.length){ SERT.riwayat = lokal; if(S.halaman==="training") renderTraining(); }
    }catch(e){}
    return;
  }
  if(SERT.riwayat.length && !paksa) return;
  server("riwayatSertifikat").then(r=>{ SERT.riwayat = r||[]; if(S.halaman==="training") renderTraining(); }).catch(()=>{});
}

/* ---------- halaman Training ---------- */
function renderTraining(){
  const kar = SDM.karyawan.slice().sort((a,b)=>a[1].localeCompare(b[1],"id"));
  const luring = !(window.google && google.script && google.script.run);
  $("#pg-training").innerHTML = `
  <div class="bar" style="margin-bottom:6px">
    <h2 style="flex:1">Sertifikat training</h2>
    <button class="btn no-print" onclick="muatRiwayatSertifikat(true)">${ICO.panah} Muat ulang riwayat</button>
  </div>
  <div class="sub" style="margin-bottom:14px">Isi formulir, periksa pratinjaunya, lalu unduh atau kirim langsung ke email peserta.
    Nama dan NRP Alamtri diambil dari sheet DATABASE KARYAWAN.</div>

  ${luring?`<div class="catatan peringatan">${ICO.lonceng.replace("<svg",'<svg width="15" height="15"')}
    <div>Pengiriman email hanya aktif pada versi Apps Script. Di pratinjau ini sertifikat tetap bisa dibuat dan diunduh.</div></div>`:""}

  <div class="grid" style="grid-template-columns:minmax(0,360px) minmax(0,1fr)">
    <div class="card"><div class="card-h"><h3>Data sertifikat</h3></div>
      <div class="card-b">
        <div class="form" style="grid-template-columns:1fr">
          <div class="f"><label for="f_peserta">Nama peserta *</label>
            <select id="f_peserta" onchange="ubahSert('peserta',this.value)">
              <option value="">— pilih karyawan —</option>
              ${kar.map(k=>`<option value="${esc(k[0])}"${SERT.peserta===k[0]?" selected":""}>${esc(k[1])} — ${esc(k[2])}</option>`).join("")}
            </select></div>
          <div class="f"><label for="f_alamtri">NRP Alamtri</label>
            <input id="f_alamtri" type="text" value="${esc(SERT.nrpAlamtri)}" readonly style="background:var(--slate-bg)"></div>
          <div class="f"><label for="f_jenisSert">Jenis training *</label>
            <input id="f_jenisSert" type="text" placeholder="contoh: Pengelolaan Fatigue" value="${esc(SERT.jenis)}"
                   oninput="SERT.jenis=this.value" onchange="ubahSert('jenis',this.value)"></div>
          <div class="f"><label for="f_tglSert">Tanggal pelaksanaan *</label>
            <input id="f_tglSert" type="date" value="${esc(SERT.tanggal)}" onchange="ubahSert('tanggal',this.value)"></div>
          <div class="f"><label for="f_nilaiSert">Nilai post test</label>
            <input id="f_nilaiSert" type="number" min="0" max="100" placeholder="0 - 100" value="${esc(SERT.nilai)}"
                   oninput="SERT.nilai=this.value" onchange="ubahSert('nilai',this.value)">
            <div class="hint">${normalize(SERT.nilai)!=="" ? `Status: <b style="color:${statusNilai(SERT.nilai)==="LULUS"?"var(--green)":"var(--red)"}">${statusNilai(SERT.nilai)}</b> — ambang kelulusan di atas ${NILAI_LULUS}` : `Nilai di atas ${NILAI_LULUS} dinyatakan Lulus`}</div></div>
          <div class="f"><label for="f_noSert">Nomor sertifikat</label>
            <input id="f_noSert" type="text" placeholder="001/SHE-MAC/IX/2026" value="${esc(SERT.nomor)}"
                   oninput="SERT.nomor=this.value" onchange="ubahSert('nomor',this.value)"></div>
          <div class="f"><label for="f_emailSert">Email peserta</label>
            <input id="f_emailSert" type="text" value="${esc(SERT.email)}" placeholder="terisi otomatis dari database"
                   onchange="SERT.email=this.value"></div>
        </div>
        <div class="bar mt">
          <button class="btn btn-pri" ${SERT.sibuk?"disabled":""} onclick="kirimSertifikat()">${ICO.media} ${SERT.sibuk?"Mengirim…":"Kirim ke email"}</button>
          <button class="btn" onclick="unduhSertifikat()">${ICO.unduh} Unduh PNG</button>
          <button class="btn" onclick="cetakSertifikat()">${ICO.cetak} Cetak / PDF</button>
        </div>
        <div class="sub mt">Email dikirim dari akun yang memasang Apps Script, dengan sertifikat terlampir sebagai berkas PNG.</div>
      </div></div>

    <div class="card"><div class="card-h"><h3>Pratinjau</h3>
      <span class="sub">${SERT.peserta?esc(namaKaryawan(SERT.peserta)):"belum ada peserta dipilih"}</span></div>
      <div class="card-b"><div id="pratinjauSert" style="background:var(--slate-bg);border-radius:12px;min-height:220px"></div></div></div>
  </div>

  <div class="card mt"><div class="card-h"><h3>Riwayat penerbitan sertifikat</h3>
    <span class="sub">${nID(SERT.riwayat.length)} sertifikat · tersimpan di sheet <b>LOG SERTIFIKAT</b>${luring?" (pratinjau: tersimpan di peramban)":""}</span></div>
    <div class="card-b"><div class="tw"><table>
      <thead><tr><th>Waktu kirim</th><th>Nama</th><th>NRP Alamtri</th><th>Jenis training</th><th>Tanggal</th><th class="num">Nilai</th><th>Hasil</th><th>Nomor</th><th>Email</th><th>Status kirim</th></tr></thead>
      <tbody>${ SERT.riwayat.length ? SERT.riwayat.slice().reverse().map(r=>`<tr>
        <td>${esc(String(r.waktu||"").slice(0,16).replace("T"," "))}</td><td><b>${esc(r.nama)}</b></td>
        <td>${esc(r.nrpAlamtri)}</td><td>${esc(r.jenis)}</td><td>${r.tanggal?fmtID(r.tanggal):"—"}</td>
        <td class="num">${esc(r.nilai)||"—"}</td>
        <td>${r.hasil?`<span class="bg ${kunci(r.hasil)==="LULUS"?"bg-g":"bg-r"}">${esc(r.hasil)}</span>`:"—"}</td>
        <td>${esc(r.nomor)}</td><td class="sub">${esc(r.email)}</td>
        <td>${kunci(r.status)==="TERKIRIM"?`<span class="bg bg-g">Terkirim</span>`:`<span class="bg bg-r">${esc(r.status||"gagal")}</span>`}</td></tr>`).join("")
        : `<tr><td colspan="10"><div class="empty">${ICO.kosong}<div>Belum ada sertifikat yang dikirim.</div></div></td></tr>`}
      </tbody></table></div></div></div>`;
  pratinjauSertifikat();
  muatRiwayatSertifikat();
}

/* =====================================================================
   PENYIMPANAN GAMBAR — tahan terhadap peramban yang memblokir unduhan
   otomatis (mis. halaman yang berjalan di dalam bingkai/iframe).
   ===================================================================== */
function simpanGambar(blob, namaBerkas, judul){
  const url = URL.createObjectURL(blob);
  let berhasil = false;
  try{
    const a = document.createElement("a");
    a.href = url; a.download = namaBerkas; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    berhasil = true;
  }catch(e){ berhasil = false; }
  /* tetap tampilkan gambarnya supaya bisa disimpan manual bila unduhan diblokir */
  $("#detailTitle").textContent = judul || "Gambar siap disimpan";
  $("#detailBody").innerHTML = `
    <div class="catatan">${ICO.unduh.replace("<svg",'<svg width="15" height="15"')}
      <div>Jika berkas tidak otomatis terunduh, gunakan tombol <b>Simpan gambar</b> di bawah, atau tekan lama gambar ini
      (di HP) / klik kanan lalu "Simpan gambar sebagai" (di komputer).</div></div>
    <img src="${url}" alt="${esc(namaBerkas)}" style="width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)">`;
  $("#detailFoot").innerHTML = `<button class="btn" data-close="ovDetail">Tutup</button>
    <a class="btn btn-pri" href="${url}" download="${esc(namaBerkas)}" target="_blank" rel="noopener">${ICO.unduh} Simpan gambar</a>`;
  $$("#detailFoot [data-close]").forEach(b=>b.onclick=()=>{ closeOv("ovDetail"); setTimeout(()=>URL.revokeObjectURL(url), 1000); });
  openOv("ovDetail");
  if(berhasil) toast("Gambar dibuat. Jika unduhan tidak muncul, simpan dari jendela ini.");
}
